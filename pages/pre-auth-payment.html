<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Dropp Payment Sample: Single Payment</title>
    <script src="https://sandbox.merchantportal.dropp.cc/dropp-sdk/dropp.min.js" type="text/javascript"></script>

    <style>
        * {
            font-family: system-ui,-apple-system,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol";
        }
        html{
            padding: 30px;
            background-color: #def8ff;
        }
        body{
            padding: 10px 60px;
            background-color: #fff;
            border-radius: 10px;
            min-height: 400px;
        }
        h1{
            margin-bottom: 7px;
        }
        .title-bar{
            margin-bottom: 50px;
        }
        .title{
            border-bottom: 3px solid black;
        }
        .subtitle{
            font-size: 90%;
            color: #666;
        }
        li{
            padding: 10px 0;
            list-style-type: '~  ';
        }
        a{
            padding: 5px 10px;
        }
        a, a:visited{
            color: black;
            text-decoration: none;
            border-bottom: 1px dotted black;
            background-color: #fff;
        }
        a:hover{
            color: black;
            text-decoration: none;
            background-color: #def8ff;
        }
        a.dropp-payment{
            padding: 0;
            border: none;
        }
        .pix{
            /*margin-top: 50px;*/
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: fit-content;
        }
        .warning{
            padding: 10px;
            background-color: #fff4e5;
            font-size: 90%;
        }
        button {
            margin: 20px 0;
            background-color: #DEF8FF;
            color: #1bc3ef;
            border: 1px solid #1bc3ef;
            padding: 10px;
            width: 200px;
            font-size: 110%;
            text-decoration: none;
        }
        label {
            display: block;
            margin: 30px 0;
        }
        input{
            height: 50px;
            width: 300px;
            border: none;
            border-bottom: 1px solid #1bc3ef;
            padding: 5px;
            font-size: 14px;
        }
                /* inline radio group: keep everything on a single line */
        .inline-radio-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: nowrap;
        }
        .inline-radio-group > label {
            display: inline-flex;
            align-items: center;
            margin-bottom: 0;
        }
        .inline-radio-group input[type="radio"] {
            margin-right: 6px;
            width:15px;
        }

    </style>
</head>
<body>

<p style="margin-top: 50px;"><strong>Pre Auth Payment</strong></p>

<form action=" https://92052880af46.ngrok-free.app/pre-auth-callback-due" target="_blank">
    <div class="form-group inline-radio-group">
        <label>Action:</label>
        <label><input type="radio" name="action" value="PROCESS" checked> Process</label>
        <label><input type="radio" name="action" value="CANCEL"> Cancel</label>
    </div>

    <label>
        Pre Auth Payment Authorization Token: <input type="text" name="recurringToken">
    </label>
    <label id="amount-group">
        Amount Due for Processing:
        $ <input type="number" name="amount" min="0.01" max="100" step="0.01">
    </label>
    <button type="submit">Process Payment Due</button>
</form>


<script>
    document.addEventListener('DOMContentLoaded', function () {
        const amountGroup = document.getElementById('amount-group');
        const amountInput = amountGroup.querySelector('input[name="amount"]');

        function updateAmountVisibility() {
            const action = document.querySelector('input[name="action"]:checked').value;
            if (action === 'PROCESS') {
                amountGroup.style.display = '';
                amountInput.disabled = false;
            } else {
                amountGroup.style.display = 'none';
                amountInput.disabled = true; // disabled inputs are not submitted
                amountInput.value = '';
            }
        }

        document.querySelectorAll('input[name="action"]').forEach(function (r) {
            r.addEventListener('change', updateAmountVisibility);
        });

        // initialise on load
        updateAmountVisibility();
    });
</script>

</body>
</html>
