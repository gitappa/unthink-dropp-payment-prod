<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropp Wallet Connect</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f4f6f8; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        h1 { color: #333; margin-bottom: 0.5rem; }
        p { color: #666; margin-bottom: 1.5rem; }
        .btn { background-color: #6200ea; color: white; padding: 12px 24px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        .btn:hover { background-color: #3700b3; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .status { margin-top: 15px; font-weight: bold; font-size: 14px; min-height: 20px; }
        .success-box { display: none; margin-top: 20px; padding: 15px; background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 6px; color: #2e7d32; }
        .error-box { display: none; margin-top: 20px; padding: 15px; background: #ffebee; border: 1px solid #ffcdd2; border-radius: 6px; color: #c62828; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Connect Wallet</h1>
        <p>Click the button below to connect your Dropp merchant account.</p>

        <div id="initial-view">
            <button class="btn" onclick="initiateConnection()">Connect Wallet</button>
        </div>

        <div id="success-view" class="success-box">
            <h3>✅ Wallet Connected!</h3>
            <p>Merchant Account:</p>
            <code id="merchant-display" style="font-size: 1.2em; font-weight: bold;"></code>
        </div>

        <div id="error-view" class="error-box">
            <h3>❌ Connection Failed</h3>
            <p id="error-message"></p>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080';
        
        async function initiateConnection() {
            const btn = document.querySelector('.btn');
            btn.disabled = true;
            btn.innerText = "Opening...";

            try {
                // 1. Request the backend to create a session and get the Auth URL
                const apiUrl = `${API_BASE_URL}/api/payments/wallet/connect`;
                console.log(`[MAIN WINDOW] Calling: ${apiUrl}`);
                
                const response = await fetch(apiUrl, { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    // Open the connect URL in a new tab
                    console.log(`[MAIN WINDOW] Opening URL in new tab: ${data.connectUrl}`);
                    window.open(data.connectUrl, '_blank', 'width=600,height=700');
                    
                    // Start polling for status updates
                    pollForConnection(data.sessionId);
                } else {
                    showError(data.error || 'Unknown error');
                    btn.disabled = false;
                    btn.innerText = "Connect Wallet";
                }
            } catch (err) {
                console.log('[MAIN WINDOW] Error:', err);
                showError('Failed to contact server');
                btn.disabled = false;
                btn.innerText = "Connect Wallet";
            }
        }

        async function pollForConnection(sessionId) {
            // Poll for up to 5 minutes
            const maxAttempts = 150; // 150 * 2 seconds = 5 minutes
            let attempts = 0;

            const pollInterval = setInterval(async () => {
                attempts++;
                
                if (attempts > maxAttempts) {
                    clearInterval(pollInterval);
                    showError('Connection timeout. Please try again.');
                    const btn = document.querySelector('.btn');
                    btn.disabled = false;
                    btn.innerText = "Connect Wallet";
                    return;
                }

                try {
                    const apiUrl = `${API_BASE_URL}/api/payments/wallet/status/${sessionId}`;
                    console.log(`[MAIN WINDOW] Polling status: ${apiUrl}`);
                    
                    const response = await fetch(apiUrl);
                    const data = await response.json();

                    if (data.success && data.status === 'connected') {
                        // Connection successful
                        clearInterval(pollInterval);
                        console.log('[MAIN WINDOW] Connection successful, merchantId:', data.merchantId);
                        
                        // Show success UI
                        document.getElementById('initial-view').style.display = 'none';
                        document.getElementById('success-view').style.display = 'block';
                        document.getElementById('merchant-display').innerText = data.merchantId;
                    }
                } catch (error) {
                    console.log('[MAIN WINDOW] Polling error:', error);
                }
            }, 2000); // Poll every 2 seconds
        }

        function showError(message) {
            document.getElementById('initial-view').style.display = 'none';
            document.getElementById('error-view').style.display = 'block';
            document.getElementById('error-message').innerText = message;
        }
    </script>
</body>
</html>
