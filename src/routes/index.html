<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company A - Merchant Signup</title>
    <style>
        /* --- Simple Signup Page Styles --- */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .signup-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .logo { font-size: 24px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #333; margin-bottom: 5px; font-weight: 600; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        /* The Authorization Button */
        .btn-dropp {
            background-color: #5d3eff; /* Dropp Purple-ish color */
            color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; 
            font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-dropp:hover { background-color: #4b2fe0; }
        .btn-dropp:disabled { background-color: #ccc; cursor: not-allowed; }
        
        /* Status Messages */
        .status-box { margin-top: 20px; padding: 10px; border-radius: 6px; font-size: 13px; display: none; }
        .status-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="signup-card">
    <div class="logo">Company A</div>
    <div class="subtitle">Create your merchant account</div>

    <div class="input-group">
        <label>Business Name</label>
        <input type="text" placeholder="e.g. Acme Corp" id="businessName">
    </div>
    <div class="input-group">
        <label>Email Address</label>
        <input type="email" placeholder="you@example.com" id="email">
    </div>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 25px 0;">

    <button id="authBtn" class="btn-dropp" onclick="handleAuthorizeClick()">
        <span>Authorize Dropp Wallet</span>
    </button>

    <input type="hidden" id="droppMerchantId" name="droppMerchantId">

    <div id="statusMsg" class="status-box"></div>
</div>

<script>
    const USER_ID = "user_123_test"; // Simulating logged-in user
    const API_BASE_URL = 'http://localhost:8080';
    // --- 1. THE EVENT LISTENER (Waits for Popup Message) ---
    // This WILL be triggered when popup calls window.opener.postMessage()
    // The popup communicates back from authorize-callback route
    window.addEventListener('message', function(event) {
        console.log('[MAIN WINDOW] Received message event:', event);
        console.log('[MAIN WINDOW] Message data:', event.data);
        console.log('[MAIN WINDOW] Message origin:', event.origin);
        
        // Security: In production, verify origin
        // if (event.origin !== 'http://localhost:8080') return;

        // Handle success
        if (event.data && event.data.type === 'DROPP_AUTH_SUCCESS') {
            const merchantId = event.data.merchantId;
            console.log('[MAIN WINDOW] SUCCESS received with merchantId:', merchantId);
            
            // UI Update
            showStatus(`✅ Success! Linked Merchant ID: ${merchantId}`, 'success');
            
            // Set hidden input value
            document.getElementById('droppMerchantId').value = merchantId;
            
            // Disable button
            const btn = document.getElementById('authBtn');
            btn.innerHTML = '✓ Linked Successfully';
            btn.disabled = true;

            // Save to backend
            linkMerchantAccount(merchantId);
        }
        
        // Handle error
        else if (event.data && event.data.type === 'DROPP_AUTH_ERROR') {
            console.log('[MAIN WINDOW] ERROR received:', event.data.error);
            showStatus(`❌ Error: ${event.data.error}`, 'error');
            
            const btn = document.getElementById('authBtn');
            btn.disabled = false;
            btn.innerHTML = 'Authorize Dropp Wallet';
        }
        
        // Unknown message type
        else {
            console.log('[MAIN WINDOW] Unknown message type:', event.data?.type);
        }
    });

    // --- 2. THE BUTTON HANDLER (Opens Popup) ---
    async function handleAuthorizeClick() {
        const btn = document.getElementById('authBtn');
        const email = document.getElementById('email').value;
        const businessName = document.getElementById('businessName').value;

        if (!email || !businessName) {
            showStatus('❌ Please fill in all fields', 'error');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = "Opening Dropp Authorization...";
        try {
            const apiUrl = `${API_BASE_URL}/api/payments/get-authorize-url`;
            console.log(`[MAIN WINDOW] Calling: ${apiUrl}`);
            
            const res = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: USER_ID,
                    email: email,
                    businessName: businessName
                })
            });

            if (!res.ok) {
                throw new Error(`HTTP ${res.status}`);
            }

            const data = await res.json();
            console.log(`[MAIN WINDOW] Backend response:`, data);

            if (!data.success) {
                showStatus(`❌ Failed to get authorization URL: ${data.error}`, 'error');
                btn.disabled = false;
                btn.innerHTML = "Authorize Dropp Wallet";
                return;
            }

            // Open popup with the authorization URL from backend
            console.log(`[MAIN WINDOW] Opening popup with URL: ${data.authorizeUrl}`);
            const popupWin = window.open(data.authorizeUrl, 'DroppAuth', 'width=600,height=700');
            
            if (!popupWin) {
                showStatus('❌ Popup blocked. Please allow popups for this site.', 'error');
                btn.disabled = false;
                btn.innerHTML = "Authorize Dropp Wallet";
                return;
            }
            
            console.log(`[MAIN WINDOW] Popup opened, waiting for postMessage...`);
        } catch (error) {
            console.error('[MAIN WINDOW] Error:', error);
            showStatus(`❌ Error: ${error.message}`, 'error');
            btn.disabled = false;
            btn.innerHTML = "Authorize Dropp Wallet";
        }
    }

    // --- 3. BACKEND SAVE (Simulated) ---
    async function linkMerchantAccount(merchantId) {
        const email = document.getElementById('email').value;
        const businessName = document.getElementById('businessName').value;

        try {
            const apiUrl = `${API_BASE_URL}/api/payments/link-merchant-account`;
            console.log(`Saving merchant account to: ${apiUrl}`);
            const res = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: USER_ID,
                    email: email,
                    merchantId: merchantId,
                    businessName: businessName
                })
            });

            const data = await res.json();
            console.log('Merchant account linked:', data);
        } catch (error) {
            console.error('Error linking merchant:', error);
        }
    }

    // Helper for UI messages
    function showStatus(msg, type) {
        const el = document.getElementById('statusMsg');
        el.style.display = 'block';
        el.className = 'status-box ' + (type === 'success' ? 'status-success' : 'status-error');
        el.innerText = msg;
    }
</script>

</body>
</html>
